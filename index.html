<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استودیوی برنامه‌نویسی فریبرز | ادیتور و پیش‌نمایش زنده</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --editor-bg: #090d16;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* هدر سایت */
    .header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    /* کانتینر اصلی */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* بخش ادیتور */
    .editor-section {
      width: 50%;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      background-color: var(--editor-bg);
    }

    .tabs {
      display: flex;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.05);
    }

    .editor-container {
      position: relative;
      flex: 1;
    }

    textarea.code-input {
      width: 100%;
      height: 100%;
      background-color: var(--editor-bg);
      color: #e2e8f0;
      border: none;
      padding: 1rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      direction: ltr;
      text-align: left;
      white-space: pre;
      display: none;
    }

    textarea.code-input.active {
      display: block;
    }

    /* بخش پیش‌نمایش */
    .preview-section {
      width: 50%;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      position: relative;
    }

    .preview-header {
      background-color: var(--panel-bg);
      color: var(--text-muted);
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    iframe#preview-canvas {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #fff;
    }

    /* نمایش خطاهای JS */
    #error-log {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(239, 68, 68, 0.95);
      color: white;
      padding: 0.6rem 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      direction: ltr;
      display: none;
      max-height: 100px;
      overflow-y: auto;
    }

    /* حالت واکنش‌گرا (موبایل و تبلت) */
    @media (max-width: 768px) {
      .workspace {
        flex-direction: column;
      }
      .editor-section, .preview-section {
        width: 100%;
        height: 50%;
      }
      .editor-section {
        border-left: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <span>⚡</span>
      <span>استودیوی برنامه‌نویسی فریبرز</span>
    </div>
    <div class="controls">
      <button class="btn" id="run-btn">اجرای دستی (Run)</button>
    </div>
  </header>

  <main class="workspace">
    <!-- بخش ادیتور کد -->
    <section class="editor-section">
      <div class="tabs">
        <button class="tab-btn active" data-tab="html">HTML</button>
        <button class="tab-btn" data-tab="css">CSS</button>
        <button class="tab-btn" data-tab="js">JavaScript</button>
      </div>
      <div class="editor-container">
        <textarea id="html-code" class="code-input active" placeholder="کد HTML را اینجا بنویسید..." spellcheck="false"><h1>سلام از استودیوی فریبرز!</h1>
<p>تغییرات را در کد ایجاد کنید تا به‌صورت زنده مشاهده کنید.</p>
<button id="demo-btn">کلیک کنید</button></textarea>

        <textarea id="css-code" class="code-input" placeholder="کد CSS را اینجا بنویسید..." spellcheck="false">body {
  font-family: sans-serif;
  padding: 20px;
  background-color: #f4f6f8;
}
h1 { color: #0284c7; }
button {
  background: #38bdf8;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
}</textarea>

        <textarea id="js-code" class="code-input" placeholder="کد JS را اینجا بنویسید..." spellcheck="false">document.getElementById('demo-btn').addEventListener('click', () => {
  alert('کد جاوااسکریپت با موفقیت اجرا شد!');
});</textarea>
      </div>
    </section>

    <!-- بخش پیش‌نمایش -->
    <section class="preview-section">
      <div class="preview-header">
        <span>پیش‌نمایش زنده (Live Preview)</span>
      </div>
      <!-- ویژگی sandbox="allow-scripts" برای حفظ امنیت و امکان اجرای JS -->
      <iframe id="preview-canvas" sandbox="allow-scripts"></iframe>
      <div id="error-log"></div>
    </section>
  </main>

  <script>
    // عناصر DOM
    const htmlInput = document.getElementById('html-code');
    const cssInput = document.getElementById('css-code');
    const jsInput = document.getElementById('js-code');
    const previewCanvas = document.getElementById('preview-canvas');
    const errorLog = document.getElementById('error-log');
    const runBtn = document.getElementById('run-btn');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const codeInputs = document.querySelectorAll('.code-input');

    let debounceTimer;

    // ۱. مدیریت تب‌های ادیتور
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        codeInputs.forEach(i => i.classList.remove('active'));

        btn.classList.add('active');
        const tabName = btn.getAttribute('data-tab');
        document.getElementById(`${tabName}-code`).classList.add('active');
      });
    });

    // ۲. تابع تزریق کد به آی‌فریم و مدیریت خطاها
    function updatePreview() {
      // پنهان‌سازی خطای قبلی
      errorLog.style.display = 'none';
      errorLog.innerText = '';

      const html = htmlInput.value;
      const css = cssInput.value;
      const js = jsInput.value;

      // ساخت سند کامل با تزریق Catch برای خطاهای JS
      const combinedSource = `
        <!DOCTYPE html>
        <html dir="rtl">
        <head>
          <meta charset="UTF-8">
          <style>${css}</style>
        </head>
        <body>
          ${html}
          <script>
            // ارسال خطاهای زمان اجرای JS به پنجره اصلی
            window.onerror = function(msg, url, line) {
              window.parent.postMessage({ type: 'IFRAME_ERROR', message: msg + ' (سطر: ' + line + ')' }, '*');
              return true;
            };
            try {
              ${js}
            } catch (err) {
              window.parent.postMessage({ type: 'IFRAME_ERROR', message: err.message }, '*');
            }
          <\/script>
        </body>
        </html>
      `;

      // تزریق مستقیم کد به srcdoc
      previewCanvas.srcdoc = combinedSource;
    }

    // ۳. سیستم Debounce جهت جلوگیری از هنگ کردن مرورگر
    function triggerDebouncedUpdate() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        updatePreview();
      }, 500); // ۵۰۰ میلی‌ثانیه تاخیر پس از آخرین تایپ
    }

    // ۴. دریافت پیام خطاهای رخ داده در iframe
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'IFRAME_ERROR') {
        errorLog.innerText = 'خطای جاوااسکریپت: ' + event.data.message;
        errorLog.style.display = 'block';
      }
    });

    // ۵. ایونت لیسنرهای ورودی‌ها
    [htmlInput, cssInput, jsInput].forEach(input => {
      input.addEventListener('input', triggerDebouncedUpdate);
    });

    runBtn.addEventListener('click', updatePreview);

    // بارگذاری اولیه
    updatePreview();
  </script>
</body>
</html>
