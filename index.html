<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استودیوی برنامه‌نویسی فریبرز | ویرایشگر و پیش‌نمایش زنده</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-card);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-clear {
      background-color: #ef4444;
      color: #fff;
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 57px);
    }

    /* بخش ویرایشگر */
    .editor-section {
      width: 50%;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      background-color: #0b0f19;
    }

    .tabs {
      display: flex;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }

    .tab {
      padding: 10px 16px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.05);
    }

    .code-area {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      height: 100%;
      background-color: transparent;
      color: #e2e8f0;
      border: none;
      padding: 15px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      direction: ltr;
      text-align: left;
      line-height: 1.5;
    }

    /* بخش پیش‌نمایش */
    .preview-section {
      width: 50%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }

    /* تنظیمات موبایل */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .editor-section, .preview-section {
        width: 100%;
        height: 50%;
      }

      .mobile-toggle {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      ⚡ استودیوی برنامه‌نویسی فریبرز
    </div>
    <div class="actions">
      <button onclick="updatePreview()">به‌روزرسانی پیش‌نمایش</button>
      <button class="btn-clear" onclick="clearCode()">پاک‌سازی</button>
    </div>
  </header>

  <div class="main-container">
    <!-- بخش کدنویسی -->
    <div class="editor-section">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('html')">HTML</div>
        <div class="tab" onclick="switchTab('css')">CSS</div>
        <div class="tab" onclick="switchTab('js')">JavaScript</div>
      </div>
      
      <div class="code-area">
        <textarea id="html-code" placeholder="کد HTML را اینجا بنویسید..." oninput="updatePreview()"><div class="card">
  <h1>استودیوی برنامه‌نویسی فریبرز</h1>
  <p>پیش‌نمایش زنده با موفقیت فعال شد!</p>
  <button onclick="showMessage()">کلیک کنید</button>
</div></textarea>
        
        <textarea id="css-code" style="display: none;" placeholder="کد CSS را اینجا بنویسید..." oninput="updatePreview()">body {
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background: #0f172a;
  color: white;
  direction: rtl;
}
.card {
  background: #1e293b;
  padding: 2rem;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
h1 { color: #38bdf8; margin-bottom: 10px; }
button {
  background: #38bdf8;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 15px;
  font-weight: bold;
}</textarea>
        
        <textarea id="js-code" style="display: none;" placeholder="کد JS را اینجا بنویسید..." oninput="updatePreview()">function showMessage() {
  alert('خوش آمدید به استودیوی برنامه‌نویسی فریبرز!');
}</textarea>
      </div>
    </div>

    <!-- بخش خروجی -->
    <div class="preview-section">
      <iframe id="preview-frame"></iframe>
    </div>
  </div>

  <script>
    let activeTab = 'html';

    function switchTab(tab) {
      activeTab = tab;
      
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('html-code').style.display = tab === 'html' ? 'block' : 'none';
      document.getElementById('css-code').style.display = tab === 'css' ? 'block' : 'none';
      document.getElementById('js-code').style.display = tab === 'js' ? 'block' : 'none';
    }

    function updatePreview() {
      const html = document.getElementById('html-code').value;
      const css = document.getElementById('css-code').value;
      const js = document.getElementById('js-code').value;

      const iframe = document.getElementById('preview-frame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      const fullContent = `
        <!DOCTYPE html>
        <html dir="rtl">
        <head>
          <style>${css}</style>
        </head>
        <body>
          ${html}
          <script>${js}<\/script>
        </body>
        </html>
      `;

      iframeDoc.open();
      iframeDoc.write(fullContent);
      iframeDoc.close();
    }

    function clearCode() {
      document.getElementById('html-code').value = '';
      document.getElementById('css-code').value = '';
      document.getElementById('js-code').value = '';
      updatePreview();
    }

    // اجرای اولیه پیش‌نمایش
    window.onload = updatePreview;
  </script>
</body>
</html>
